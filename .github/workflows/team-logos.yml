name: Fetch team logos (redesign preview)

# Runs only on the redesign branch, whenever the logo script changes.
on:
  push:
    branches: [claude/project-thread-etkzqu]
    paths: [tools/team-logos.mjs, .github/workflows/team-logos.yml]

permissions:
  contents: write   # save the logos back to this branch

jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Copy team logos from Liquipedia
        run: node tools/team-logos.mjs
      - name: Save them to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/teams
          git diff --cached --quiet || git commit -m "Team logos from Liquipedia"
          git push
