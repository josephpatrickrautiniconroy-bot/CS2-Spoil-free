name: Video quality probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['probe/**', '.github/workflows/quality-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1.48.2
      - name: Headless Chrome
        run: node probe/quality.mjs
        env:
          PROBE_CHANNEL: chrome
          PROBE_CASES: 'desk 854x480,control,site desk'
          PROBE_TAG: 'headless '
      - name: Chrome with a screen
        run: xvfb-run -a node probe/quality.mjs
        env:
          PROBE_CHANNEL: chrome
          PROBE_HEADED: '1'
          PROBE_TAG: 'headed '
